name: test

# Tests only: strava-sync is an ad hoc CLI, nothing deploys and CI holds no secrets.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
