[project]
name = "strava-sync"
version = "0.1.0"
description = "Imports Strava bulk exports into soma cardio_workouts: rows, retained originals and samples"
requires-python = ">=3.13"
dependencies = [
    "fitdecode>=0.11.0",
    "gpxpy>=1.6.2",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
]

[project.scripts]
strava-sync = "strava_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_sync"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
